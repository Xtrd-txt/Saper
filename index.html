<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сапёр - Классическая игра</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <span class="title-text">Сапёр</span>
            <div class="title-buttons">
                <button class="title-btn minimize">_</button>
                <button class="title-btn maximize">□</button>
                <button class="title-btn close">×</button>
            </div>
        </div>

        <div class="menu-bar">
            <div class="menu-item" id="menu-game">
                Игра ▼
                <div class="dropdown" id="dropdown-game">
                    <div class="dropdown-item" data-action="new">Новая игра</div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" data-difficulty="easy">Новичок (9×9, 10 мин)</div>
                    <div class="dropdown-item" data-difficulty="medium">Любитель (16×16, 40 мин)</div>
                    <div class="dropdown-item" data-difficulty="hard">Профи (30×16, 99 мин)</div>
                </div>
            </div>
            <div class="menu-item" id="menu-help">
                Справка ▼
                <div class="dropdown" id="dropdown-help">
                    <div class="dropdown-item" data-action="help">Как играть</div>
                    <div class="dropdown-item" data-action="about">О программе</div>
                </div>
            </div>
        </div>

        <div class="game-container">
            <div class="status-bar">
                <div class="counter mines-counter">
                    <span class="digit" id="mines-100">0</span>
                    <span class="digit" id="mines-10">0</span>
                    <span class="digit" id="mines-1">0</span>
                </div>

                <button class="face-btn" id="face-btn">
                    <span class="face">🙂</span>
                </button>

                <div class="counter timer-counter">
                    <span class="digit" id="timer-100">0</span>
                    <span class="digit" id="timer-10">0</span>
                    <span class="digit" id="timer-1">0</span>
                </div>
            </div>

            <div class="game-field" id="game-field">
                <!-- Cells will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Modal for help/about -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-window">
            <div class="title-bar">
                <span class="title-text" id="modal-title">Справка</span>
                <div class="title-buttons">
                    <button class="title-btn close" id="modal-close">×</button>
                </div>
            </div>
            <div class="modal-content" id="modal-content">
            </div>
            <div class="modal-buttons">
                <button class="retro-btn" id="modal-ok">OK</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
